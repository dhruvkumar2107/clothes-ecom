version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Application
  # ─────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lumen-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/prod.db
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_COOKIE_NAME=lmn_session
      - SESSION_MAX_AGE=2592000
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_MESSAGING_SERVICE_SID=${TWILIO_MESSAGING_SERVICE_SID}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY}
      - MSG91_TEMPLATE_ID=${MSG91_TEMPLATE_ID}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - RAZORPAYX_KEY_ID=${RAZORPAYX_KEY_ID}
      - RAZORPAYX_KEY_SECRET=${RAZORPAYX_KEY_SECRET}
      - CASHFREE_CLIENT_ID=${CASHFREE_CLIENT_ID}
      - CASHFREE_CLIENT_SECRET=${CASHFREE_CLIENT_SECRET}
      - BANK_VERIFICATION_PROVIDER=${BANK_VERIFICATION_PROVIDER:-mock}
      - DECENTRO_CLIENT_ID=${DECENTRO_CLIENT_ID}
      - DECENTRO_CLIENT_SECRET=${DECENTRO_CLIENT_SECRET}
      - DECENTRO_MODULE_SECRET=${DECENTRO_MODULE_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REFERRAL_WELCOME_COUPON=WELCOME200
      - REFERRAL_COMMISSION_PERCENT=7.5
      - REFERRAL_HOLD_DAYS=14
      - ENABLE_GRAIN=true
      - ENABLE_AR=false
      - ENABLE_360=false
    volumes:
      - app-data:/data
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────────────
  # Database (SQLite with volume persistence)
  # For production, replace with PostgreSQL service
  # ─────────────────────────────────────────────────────────────────────────────
  # db:
  #   image: postgres:16-alpine
  #   container_name: lumen-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_DB=lumen
  #     - POSTGRES_USER=lumen
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis (for caching, sessions, rate limiting)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy (optional - for SSL termination, static caching)
  # ─────────────────────────────────────────────────────────────────────────────
  # nginx:
  #   image: nginx:alpine
  #   container_name: lumen-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app

volumes:
  app-data:
    driver: local
  app-uploads:
    driver: local
  redis-data:
    driver: local
  # db-data:
  #   driver: local

networks:
  default:
    name: lumen-network